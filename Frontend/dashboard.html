<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamification DS - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
        .header { background: #1a1a2e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; }
        .header h1 { font-size: 18px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-info img { width: 32px; height: 32px; border-radius: 50%; }
        .user-info span { color: #888; font-size: 14px; }
        .btn-logout { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-logout:hover { background: #444; }
        .container { max-width: 800px; margin: 32px auto; padding: 0 24px; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin-bottom: 16px; color: #aaa; }
        .field { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .field:last-child { border-bottom: none; }
        .field-label { color: #888; font-size: 14px; }
        .field-value { font-size: 14px; }
        .badge { display: inline-block; background: #2a2a4a; color: #7c7cff; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin: 2px; }
        .badge-green { background: #1a3a1a; color: #4caf50; }
        .teams { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .loading { text-align: center; padding: 48px; color: #888; }
        .error { text-align: center; padding: 48px; color: #ff4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Gamification DS</h1>
        <div class="user-info">
            <img id="avatar" src="" alt="">
            <span id="name"></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="content" class="loading">Loading profile...</div>
    </div>

    <script type="module">
        const API = 'https://gamification-ds.onrender.com';
        let token = localStorage.getItem('accessToken');

        if (!token) {
            window.location.href = '/';
        }

        async function api(path, options = {}) {
            const res = await fetch(API + path, {
                ...options,
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json',
                    ...options.headers,
                },
            });
            if (res.status === 401) {
                const refreshRes = await fetch(API + '/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken: localStorage.getItem('refreshToken') }),
                });
                if (refreshRes.ok) {
                    const data = await refreshRes.json();
                    token = data.accessToken;
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    return api(path, options);
                }
                window.location.href = '/';
                return;
            }
            return res.json();
        }

        function render(user) {
            document.getElementById('avatar').src = user.avatarUrl || '';
            document.getElementById('name').textContent = user.name || user.email;

            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h2>Profile</h2>
                    <div class="field"><span class="field-label">Name</span><span class="field-value">${user.name || '-'}</span></div>
                    <div class="field"><span class="field-label">Email</span><span class="field-value">${user.email}</span></div>
                    <div class="field"><span class="field-label">City</span><span class="field-value">${user.emplannerCity || '-'}, ${user.emplannerCountry || '-'}</span></div>
                    <div class="field"><span class="field-label">Contract</span><span class="field-value">${user.extraId || '-'}</span></div>
                    <div class="field"><span class="field-label">Slack</span><span class="field-value">${user.slackId || '-'}</span></div>
                </div>

                <div class="card">
                    <h2>Roles</h2>
                    <div>${user.roles?.map(r => '<span class="badge">' + (r.role?.code || r) + '</span>').join('') || '<span class="badge">MEMBER</span>'}</div>
                </div>

                <div class="card">
                    <h2>Specializations</h2>
                    <div>${user.specializations?.map(s => '<span class="badge badge-green">' + (s.specialization?.code || s) + '</span>').join('') || '<span style="color:#555">None assigned</span>'}</div>
                </div>

                <div class="card">
                    <h2>Emplanner Teams</h2>
                    <div style="margin-bottom:8px;color:#888;font-size:13px">Member:</div>
                    <div class="teams">${(user.emplannerTeams?.member || []).map(t => '<span class="badge">' + t.name + '</span>').join('') || '<span style="color:#555">-</span>'}</div>
                    <div style="margin:12px 0 8px;color:#888;font-size:13px">Leader:</div>
                    <div class="teams">${(user.emplannerTeams?.leader || []).map(t => '<span class="badge badge-green">' + t.name + '</span>').join('') || '<span style="color:#555">-</span>'}</div>
                </div>

                <div class="card">
                    <h2>Emplanner Info</h2>
                    <div class="field"><span class="field-label">Roles</span><span class="field-value">${(user.emplannerRoles || []).join(', ') || '-'}</span></div>
                    <div class="field"><span class="field-label">Tags</span><span class="field-value">${(user.emplannerTags || []).join(', ') || '-'}</span></div>
                    <div class="field"><span class="field-label">UTC</span><span class="field-value">${user.emplannerUtc ?? '-'}</span></div>
                    <div class="field"><span class="field-label">Feedback</span><span class="field-value">${user.emplannerFeedbackUrl ? '<a href="' + user.emplannerFeedbackUrl + '" target="_blank" style="color:#7c7cff">Open</a>' : '-'}</span></div>
                </div>
            `;
        }

        async function init() {
            try {
                const user = await api('/api/users/me');
                if (user.error) throw new Error(user.error);
                render(user);
            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="error">' + e.message + '</div>';
            }
        }

        window.logout = function() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            window.location.href = '/';
        };

        init();
    </script>
</body>
</html>
